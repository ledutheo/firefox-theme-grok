<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Grok Night</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0A0A0A; color: #FCFCFC;
      font-family: ui-sans-serif, system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    .c { text-align: center; }
    img { width: 88px; height: 88px; border-radius: 20px; }
    h1 { font-weight: 200; letter-spacing: .4em; font-size: 2.4rem; margin: 18px 0 10px; }
    .bar { width: 36px; height: 3px; background: #FF6B35; margin: 0 auto 16px; }
    p { color: #9E9E9E; margin: 0; }
    .box {
      margin-top: 48px;
      width: min(560px, 86vw);
      height: 48px;
      border: 1px solid #2A2A2A;
      border-radius: 999px;
      color: #6C6C6C;
      display: flex; align-items: center; padding: 0 20px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="c">
    <img src="img/icon-128.png" alt="">
    <h1>GROK NIGHT</h1>
    <div class="bar"></div>
    <p>Pour les fans — et pour les autres.</p>
    <div class="box">Demande ce que tu veux</div>
  </div>
</body>
</html>
