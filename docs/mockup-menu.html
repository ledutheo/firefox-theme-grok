<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Grok Night — menu</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #0A0A0A;
      font-family: ui-sans-serif, system-ui, sans-serif; color: #FCFCFC; }
    .window { width: 1280px; height: 800px; display: flex; flex-direction: column; background: #0A0A0A; }
    .tabs {
      height: 48px; display: flex; align-items: flex-end; padding: 0 12px; gap: 4px;
      background: linear-gradient(90deg, #0A0A0A 70%, #160e0c);
    }
    .tab { height: 36px; padding: 0 16px; border-radius: 8px 8px 0 0; display: flex; align-items: center;
      font-size: 13px; color: #9E9E9E; min-width: 140px; }
    .tab.active { background: #141414; color: #FCFCFC; box-shadow: inset 0 -2px 0 #FF6B35; }
    .toolbar { height: 48px; background: #141414; border-bottom: 1px solid #2A2A2A;
      display: flex; align-items: center; padding: 0 10px; gap: 8px; }
    .nav { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: #2A2A2A; }
    .omni { flex: 1; height: 34px; border-radius: 999px; background: #111; border: 1px solid #2A2A2A;
      display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: #9E9E9E; }
    .page { flex: 1; position: relative; background: #0A0A0A; }
    .menu {
      position: absolute; top: 8px; right: 16px; width: 260px;
      background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 10px;
      padding: 8px 0; box-shadow: 0 16px 40px rgba(0,0,0,.45);
    }
    .item { padding: 10px 16px; font-size: 13px; color: #FCFCFC; }
    .item.hi { background: #FF6B35; color: #0A0A0A; }
    .sep { height: 1px; background: #2A2A2A; margin: 6px 0; }
  </style>
</head>
<body>
  <div class="window">
    <div class="tabs">
      <div class="tab">grok.com</div>
      <div class="tab active">Grok Night</div>
    </div>
    <div class="toolbar">
      <div class="nav"></div><div class="nav"></div>
      <div class="omni">https://grok.com</div>
      <div class="nav" style="background:#FF6B35"></div>
    </div>
    <div class="page">
      <div class="menu">
        <div class="item">Nouvel onglet</div>
        <div class="item hi">Nouvelle fenêtre privée</div>
        <div class="item">Signets</div>
        <div class="sep"></div>
        <div class="item">Paramètres</div>
        <div class="item">Plus d’outils</div>
        <div class="sep"></div>
        <div class="item">Quitter</div>
      </div>
    </div>
  </div>
</body>
</html>
