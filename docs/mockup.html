<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Grok Night — mockup</title>
  <style>
    @font-face {
      font-family: "Source Sans";
      src: local("Source Sans Pro ExtraLight"), local("SourceSansPro-ExtraLight");
      font-weight: 200;
    }
    @font-face {
      font-family: "Source Sans";
      src: local("Source Sans Pro"), local("SourceSansPro-Regular");
      font-weight: 400;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1280px;
      height: 800px;
      overflow: hidden;
      background: #050505;
      font-family: "Source Sans", "DejaVu Sans", ui-sans-serif, sans-serif;
      color: #FCFCFC;
    }
    .window {
      width: 1280px;
      height: 800px;
      background: #0A0A0A;
      display: flex;
      flex-direction: column;
    }
    .tabs {
      height: 48px;
      background:
        radial-gradient(ellipse 280px 120px at 96% 40%, rgba(255,107,53,.18), transparent 70%),
        linear-gradient(90deg, #0A0A0A 0%, #0A0A0A 70%, #160e0c 100%);
      display: flex;
      align-items: flex-end;
      padding: 0 10px 0 12px;
      gap: 4px;
    }
    .tab {
      height: 36px;
      padding: 0 16px;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #9E9E9E;
      background: transparent;
      min-width: 140px;
      max-width: 220px;
    }
    .tab.active {
      background: #141414;
      color: #FCFCFC;
      box-shadow: inset 0 -2px 0 #FF6B35;
    }
    .tab .fav {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: #242424;
    }
    .tab.active .fav { background: #FF6B35; }
    .plus {
      width: 28px;
      height: 28px;
      margin: 0 0 4px 4px;
      border-radius: 6px;
      color: #9E9E9E;
      display: grid;
      place-items: center;
      font-size: 18px;
    }
    .win-btns {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-self: center;
      padding-right: 6px;
    }
    .win-btns i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: block;
    }
    .win-btns .min { background: #2A2A2A; }
    .win-btns .max { background: #2A2A2A; }
    .win-btns .cls { background: #FF6B35; }
    .toolbar {
      height: 48px;
      background: #141414;
      border-bottom: 1px solid #2A2A2A;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
    }
    .nav {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #FCFCFC;
    }
    .nav svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .omni {
      flex: 1;
      height: 34px;
      border-radius: 999px;
      background: #111111;
      border: 1px solid #FF6B35;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      font-size: 13px;
    }
    .lock {
      width: 12px;
      height: 12px;
      border: 1.6px solid #FF6B35;
      border-radius: 3px 3px 2px 2px;
      position: relative;
    }
    .lock::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 2px;
      width: 6px;
      height: 6px;
      border: 1.6px solid #FF6B35;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
    }
    .omni .url { color: #FCFCFC; letter-spacing: .02em; }
    .omni .dim { color: #9E9E9E; }
    .mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
    }
    .page {
      flex: 1;
      background: #0A0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      position: relative;
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 420px 280px at 50% 42%, rgba(255,107,53,.07), transparent 70%);
      pointer-events: none;
    }
    .hero-mark {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      z-index: 1;
    }
    h1 {
      margin: 0;
      font-weight: 200;
      letter-spacing: .42em;
      font-size: 42px;
      z-index: 1;
    }
    .bar {
      width: 36px;
      height: 3px;
      background: #FF6B35;
      z-index: 1;
    }
    p {
      margin: 0;
      color: #9E9E9E;
      font-size: 15px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="tabs">
      <div class="tab"><span class="fav"></span>about:addons</div>
      <div class="tab active"><span class="fav"></span>grok.com</div>
      <div class="tab"><span class="fav"></span>ledutheo</div>
      <div class="plus">+</div>
      <div class="win-btns"><i class="min"></i><i class="max"></i><i class="cls"></i></div>
    </div>
    <div class="toolbar">
      <div class="nav"><svg viewBox="0 0 16 16"><path d="M10 3 L5 8 L10 13"/></svg></div>
      <div class="nav"><svg viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13"/></svg></div>
      <div class="nav"><svg viewBox="0 0 16 16"><path d="M3 8h10M10 5l3 3-3 3"/></svg></div>
      <div class="omni">
        <span class="lock"></span>
        <span class="url"><span class="dim">https://</span>grok.com</span>
      </div>
      <img class="mark" src="img/icon-128.png" alt="">
    </div>
    <div class="page">
      <img class="hero-mark" src="img/icon-128.png" alt="">
      <h1>GROK NIGHT</h1>
      <div class="bar"></div>
      <p>Firefox, habillé comme grok.com</p>
    </div>
  </div>
</body>
</html>
